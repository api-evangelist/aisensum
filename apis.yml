name: AiSensum
description: >-
  AiSensum (AISensum) builds agentic AI "teammates" that work alongside front-line staff to
  drive revenue, improve quality, and reduce labour while keeping the human in the lead. Operating
  since 2017 with a presence across Southeast Asia, it deploys purpose-built AI teammates for
  enterprise front-line operations in retail, F&B, hospitality and entertainment, each specialising
  in one measurable outcome: Daniel (revenue teammate, personalised counter offers/upsell), Sasha
  (time and cost teammate, bulk product-photo editing and approval), and Nicole (progress teammate,
  conversation scoring and cashier coaching against brand SOPs). Deployments are scoped through a
  half-day IFA (Intelligent Front-line Automation) Workshop. AiSensum publishes no public API,
  SDK, or developer portal; it is a portfolio company of 500 Global tracked in the API Evangelist
  network. This profile was enriched from the company's public web presence and an on-site llms.txt.
